<div class="page-header">
  <h2 class="title">角色 AppRole <span class="subtitle">使用者角色</span></h2>
  <div class="actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [badge]="hasFilters ? '•' : undefined"
      (onClick)="openFilters()"
    />
    <p-button label="新增" icon="pi pi-plus" (onClick)="add()" />
  </div>
</div>

<div class="page-card table-card">
  <p-table
    [value]="roles()"
    [loading]="loading()"
    dataKey="roleId"
    [paginator]="true"
    paginatorPosition="top"
    [first]="page.first"
    [rows]="page.rows"
    [rowsPerPageOptions]="[10, 20, 50, 100]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sort.field"
    [sortOrder]="sort.order"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [showGridlines]="true"
    size="small"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="roleId">角色代碼 <p-sortIcon field="roleId" /></th>
        <th pSortableColumn="roleName">角色名稱 <p-sortIcon field="roleName" /></th>
        <th pSortableColumn="permissionLevel" class="text-center" style="width: 8rem">
          權限等級 <p-sortIcon field="permissionLevel" />
        </th>
        <th pSortableColumn="description">描述 <p-sortIcon field="description" /></th>
        <th pSortableColumn="userCount" class="text-center" style="width: 7rem">
          使用者數 <p-sortIcon field="userCount" />
        </th>
        <th class="text-center" style="width: 9rem">操作</th>
      </tr>
    </ng-template>
    <ng-template #body let-role>
      <tr>
        <td>{{ role.pkid }}</td>
        <td>{{ role.roleId }}</td>
        <td>{{ role.roleName }}</td>
        <td class="text-center">{{ role.permissionLevel }}</td>
        <td>{{ role.description }}</td>
        <td class="text-center">{{ role.userCount }}</td>
        <td class="text-center actions-cell">
          <a
            pButton
            [text]="true"
            [rounded]="true"
            severity="secondary"
            pTooltip="檢視"
            aria-label="檢視"
            [routerLink]="['/app-roles', role.roleId]"
          ><i class="pi pi-eye" pButtonIcon></i></a>
          <a
            pButton
            [text]="true"
            [rounded]="true"
            severity="info"
            pTooltip="編輯"
            aria-label="編輯"
            [routerLink]="['/app-roles', role.roleId, 'edit']"
          ><i class="pi pi-pencil" pButtonIcon></i></a>
          <p-button
            icon="pi pi-trash"
            [text]="true"
            [rounded]="true"
            severity="danger"
            pTooltip="刪除"
            ariaLabel="刪除"
            (onClick)="remove(role)"
          />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="7" class="text-center">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer
  [visible]="filterVisible()"
  (visibleChange)="filterVisible.set($event)"
  position="right"
  header="搜尋條件"
  styleClass="filter-drawer"
>
  <form (ngSubmit)="applyFilters()">
    <div class="form-field">
      <label for="keyword">關鍵字</label>
      <input
        pInputText
        id="keyword"
        name="keyword"
        placeholder="角色代碼、名稱、描述"
        [(ngModel)]="draft.keyword"
      />
    </div>
    <div class="form-field">
      <label for="levelFrom">權限等級（起）</label>
      <p-inputnumber inputId="levelFrom" name="levelFrom" [(ngModel)]="draft.permissionLevelFrom" [useGrouping]="false" />
    </div>
    <div class="form-field">
      <label for="levelTo">權限等級（迄）</label>
      <p-inputnumber inputId="levelTo" name="levelTo" [(ngModel)]="draft.permissionLevelTo" [useGrouping]="false" />
    </div>
    <div class="drawer-actions">
      <p-button label="清除" icon="pi pi-times" severity="secondary" (onClick)="clearFilters()" />
      <p-button label="搜尋" icon="pi pi-search" type="submit" />
    </div>
  </form>
</p-drawer>

<p-confirmdialog />
