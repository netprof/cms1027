<form [formGroup]="form" (ngSubmit)="save()">
  <div class="page-header">
    <h2 class="title">{{ isEdit ? '編輯角色' : '新增角色' }}</h2>
    <div class="actions">
      <p-button label="取消" icon="pi pi-times" severity="secondary" (onClick)="cancel()" />
      <p-button label="儲存" icon="pi pi-check" type="submit" [loading]="saving()" />
    </div>
  </div>

  <div class="page-card">
    <h3>角色資料</h3>

    <div class="form-field">
      <label for="roleId" class="required">角色代碼</label>
      <input pInputText id="roleId" formControlName="roleId" placeholder="請輸入角色代碼" maxlength="200" />
      @if (invalid('roleId')) {
        <small class="error">請輸入角色代碼</small>
      }
    </div>

    <div class="form-field">
      <label for="roleName" class="required">角色名稱</label>
      <input pInputText id="roleName" formControlName="roleName" maxlength="200" />
      @if (invalid('roleName')) {
        <small class="error">請輸入角色名稱</small>
      }
    </div>

    <div class="form-field">
      <label for="permissionLevel" class="required">權限等級</label>
      <p-inputnumber inputId="permissionLevel" formControlName="permissionLevel" [useGrouping]="false" />
      @if (invalid('permissionLevel')) {
        <small class="error">請輸入權限等級</small>
      }
    </div>

    <div class="form-field">
      <label for="description">描述</label>
      <input pInputText id="description" formControlName="description" maxlength="400" />
    </div>
  </div>

  <div class="page-card">
    <h3>使用者</h3>
    <div class="form-field">
      <p-multiselect
        inputId="userIds"
        formControlName="userIds"
        [options]="userOptions()"
        optionLabel="label"
        optionValue="userId"
        display="chip"
        [filter]="true"
        [maxSelectedLabels]="9999"
        placeholder="選擇使用者（可複選）"
        appendTo="body"
        styleClass="user-select"
      />
    </div>
  </div>
</form>
